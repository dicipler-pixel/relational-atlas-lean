name = "relational-atlas-lean"
version = "1.0.0"
defaultTargets = ["RelationalAtlas"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "RelationalAtlas"
roots = [
  "RelationalAtlas.Basic",
  "RelationalAtlas.AtlasFormalCore",
  "RelationalAtlas.Extended",
  "RelationalAtlas.Extended2",
  "RelationalAtlas.Extended3",
  "RelationalAtlas.Extended4",
  "RelationalAtlas.Extended5",
  "RelationalAtlas.Extended6",
  "RelationalAtlas.Extended7",
  "RelationalAtlas.Extended8",
  "RelationalAtlas.Extended9",
]
